# Build MCUboot alongside the app, so the sensor can be updated over USB
# without ever opening the case for SWD.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Unsigned images.
#
# This has to be set HERE and not in sysbuild/mcuboot.conf — sysbuild owns the
# signature type and overwrites whatever the image-level config says. Left at
# the NCS default, MCUboot builds with ECDSA-P256 + tinycrypt and grows past
# the bootloader partition.
#
# Dropping the signature costs nothing real: the default NCS setup signs with a
# published development key, so it authenticates nothing. Images are still
# SHA-256 checked. If these ever ship, generate a private key, point
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE at it, switch to ECDSA_P256, and grow the
# mcuboot partition in pm_static.yml to 160 KB.
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
