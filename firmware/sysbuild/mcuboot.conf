# MCUboot image configuration.
#
# No serial recovery here, unlike the FindMyTag build this project was forked
# from. Updates arrive through the RUNNING APPLICATION's mcumgr SMP endpoint
# (see prj.conf), which is strictly nicer to use: no power-cycle to time, no
# 1 s DFU window on every single boot to pay for it.
#
# The trade is that a truly dead application cannot be recovered over USB —
# that needs the SWD header and tools/flash.command. Same deal as the
# JAVELYTICS firmware this update flow is taken from.

CONFIG_FLASH=y
CONFIG_FPROTECT=y

# board.c (the UICR REGOUT0 fixup) is linked into the bootloader image too, and
# it reboots once after rewriting UICR. FindMyTag got sys_reboot() for free
# because serial recovery selects REBOOT; this build dropped serial recovery,
# so the bootloader link fails without it. Running the fixup here rather than
# only in the app is the better order anyway: the rails are right before
# anything downstream looks at a GPIO.
CONFIG_REBOOT=y

# The board defconfig turns SPI on for the application's IMU; the bootloader
# has no business touching it, and leaving it enabled drags nrfx SPIM in for
# nothing.
CONFIG_SPI=n

# No USB in the bootloader at all now that serial recovery is gone.
CONFIG_USB_DEVICE_STACK=n

# LED indication needs a led0 alias, which this board does not define
# (it has led_r/led_g/led_b instead).
CONFIG_GPIO=y
CONFIG_MCUBOOT_INDICATION_LED=n

# NOTE: the image signature type is NOT set here — sysbuild owns it and would
# overwrite this file. See SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE in sysbuild.conf.
