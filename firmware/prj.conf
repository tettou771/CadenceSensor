# Cadence sensor — application configuration
# SPDX-License-Identifier: Apache-2.0

# --- core peripherals ---
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PINCTRL=y
# SAADC, for the battery divider. Boards that cannot see their own battery
# (no io-channels in their zephyr,user node) still build; src/battery.c
# compiles to stubs and reports itself absent.
CONFIG_ADC=y

# --- floating point ---
# The cadence detector runs an angle unwrapper with atan2f/sqrtf per sample.
# On the M4F that is single-cycle-ish hardware; in software emulation it would
# not fit the 64 Hz budget. SHARING because the console prints floats from a
# different thread than the sampler.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# --- Bluetooth: Cycling Speed and Cadence peripheral ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n
# The name a rider picks out of a scan list. ble_csc.c appends "-XXXX" from the
# factory device id and pushes the result into BOTH the advertisement and the
# GAP Device Name characteristic, so change it here and it changes everywhere.
# Keep it short: head unit displays are narrow, and the whole string has to fit
# the 31-byte scan response alongside nothing else, so ~20 chars is the ceiling.
CONFIG_BT_DEVICE_NAME="Cadence"
# bt_set_name() needs the name to be writable at runtime.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
# ...but only by US. DYNAMIC defaults GATT_WRITABLE on, which with SMP=n means
# any device that can connect can rename the sensor, unauthenticated. Nothing
# needs that: the name is set once at boot from the factory device id.
CONFIG_BT_DEVICE_NAME_GATT_WRITABLE=n
# Appearance = (category 0x12 "Cycling" << 6) | subcategory 3 "Cadence Sensor".
# Not 1157, which is "Speed and Cadence Sensor" — this one cannot see the wheel.
CONFIG_BT_DEVICE_APPEARANCE=1155

# No pairing. The CSC profile does not require encryption, nothing here is
# writable, and a sensor that demands bonding is a sensor that shows up in an
# OS pairing list and eventually has to be forgotten from it. Head units
# connect to a plain unencrypted CSC sensor without any of that.
CONFIG_BT_SMP=n
CONFIG_BT_BONDABLE=n
CONFIG_BT_PRIVACY=n

# Two simultaneous links, so a head unit and a phone can both watch at once.
#
# This is where BLE differs from ANT+ in a way that is easy to be caught out by.
# ANT+ sensors BROADCAST, so any number of receivers can listen to one sensor
# and none of them excludes the others. CSC over BLE runs on a GATT connection
# instead, which is point to point: a peripheral that allows one link belongs
# entirely to whichever device connects first, and the phone then cannot see the
# sensor at all while the bike computer has it (or the other way round). Two is
# the number that actually comes up — bike computer plus phone.
#
# Cost is a connection's worth of RAM and roughly 55 uA while the second link is
# up. Against the whole budget (tools/power_budget.py) that is about 7 % of
# battery life, because riding is only one hour in twenty-four.
CONFIG_BT_MAX_CONN=2

# Battery Service (a head unit shows the sensor's battery next to its own) and
# Device Information.
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="tettou771"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="Cadence Sensor"

# Connection parameters. A cadence sensor sends at most ~3 notifications per
# second (200 rpm), so a short connection interval buys nothing and costs
# battery. Latency 4 lets the peripheral skip up to four connection events
# when it has nothing to say, which is most of them while coasting.
# Supervision timeout must exceed (latency+1) * max_int * 2 = 600 ms; 4 s
# leaves room for a rider disappearing behind a bus.
# Units: intervals are 1.25 ms, timeout is 10 ms. So 24 = 30 ms, 48 = 60 ms,
# 400 = 4 s. (Kconfig has no inline comments — a trailing # here is part of
# the value and the assignment gets silently dropped.)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=48
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- USB CDC-ACM ---
# Two endpoints, split by job (see the dts): uart0 is the human console,
# uart1 is the mcumgr SMP channel firmware updates arrive on.
#
# Not initialized at boot: main() brings USB up only when VBUS is present, so
# a battery-powered sensor never pays for USB enumeration.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_MANUFACTURER="tettou771"
CONFIG_USB_DEVICE_PRODUCT="Cadence Sensor"
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x7695
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- USB firmware update: MCUboot + mcumgr SMP over the 2nd CDC-ACM ---
# The app is built MCUboot-signed (sysbuild.conf builds the bootloader). SMP
# runs on cdc_acm_uart1 (dts: chosen zephyr,uart-mcumgr) so the console stays a
# clean stream. The host uploads to the secondary slot and issues an SMP reset;
# MCUboot swaps the image in on the next boot. No probe, no power cycle, and
# no bootloader DFU window to hit.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y                             # SMP frames are CRC16-checked
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- logging ---
# Deferred so a log call from the sampler thread never blocks it on USB; the
# sampler missing its deadline would corrupt revolution timestamps, which is
# the one thing this firmware cannot afford to get wrong.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_BOOT_BANNER=n

# --- power / clocks ---
CONFIG_REBOOT=y
CONFIG_PM_DEVICE=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
